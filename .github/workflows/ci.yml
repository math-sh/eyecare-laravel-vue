name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a execucao anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — estilo e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      # --test falha em vez de reescrever os arquivos no runner.
      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      # A suite roda em SQLite em memoria (ver phpunit.xml), sem servico de banco.
      - name: Testes
        run: php artisan test

  painel:
    name: Painel — lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: painel/package-lock.json

      - run: npm ci
      - run: npm run build
